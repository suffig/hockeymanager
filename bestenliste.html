<body data-nav="Bestenliste">
<div id="hdr"></div>

<section class="block tight">
  <div class="wrap">
    <span class="eyebrow">Alle Laufbahnen, alle Spieler</span>
    <h1 style="font-size:clamp(30px,4.5vw,46px)">Weltweite Bestenliste</h1>

  </div>

<!-- ================================================================
     Die Vereine

     Was der Pokalraum lokal zeigt, hier ueber alle freigegebenen
     Laufbahnen. Bleibt verborgen, solange nichts zurueckkommt - eine
     leere Ueberschrift ist schlimmer als keine.
     ================================================================ -->
<section class="block tight" id="vereine-block" hidden>
  <div class="wrap">
    <div class="row between">
      <div>
        <span class="eyebrow">Über alle Laufbahnen</span>
        <h2 style="margin:2px 0 0">Die Vereine</h2>
      </div>
      <select id="v-sort" style="width:auto">
        <option value="saisons">Nach Saisons</option>
        <option value="titel">Nach Titeln</option>
        <option value="punkte">Nach Ausbeute</option>
        <option value="spieler">Nach Spielern</option>
      </select>
    </div>
    <p class="small">Jede freigegebene Laufbahn zählt mit. Ein Klick auf einen Verein
      zeigt, wer dort gespielt hat.</p>
    <div id="vereine" class="mt"></div>
  </div>
</section>

<div id="ftr"></div>

<script src="assets/data.js?v=83b68fb4"></script>
<script src="assets/draft.js?v=83b68fb4"></script>
<script src="assets/engine.js?v=83b68fb4"></script>
<script src="assets/ereignisse.js?v=83b68fb4"></script>
<script src="assets/wappen.js?v=83b68fb4"></script>
<script src="assets/ui.js?v=83b68fb4"></script>
<script src="assets/konto-config.js?v=83b68fb4"></script>
<script src="assets/konto.js?v=83b68fb4"></script>
<script src="assets/bestenliste.js?v=83b68fb4">
/* ------------------------------------------------------------------
   Die Vereinschronik

   Gerechnet wird in der Datenbank (db/07_vereine.sql); hier steht nur
   die Darstellung. Aufgeklappt wird immer nur ein Verein.
   ------------------------------------------------------------------ */
let vOffen = null, vGeladen = false;

async function vereineZeichnen(){
  const block = document.getElementById('vereine-block');
  if (!block || typeof KONTO === 'undefined' || !KONTO.vereinsChronik) return;
  const wie = (document.getElementById('v-sort') || {}).value || 'saisons';
  const { zeilen, fehler } = await KONTO.vereinsChronik({ sortiert: wie });
  if (fehler || !zeilen.length){ block.hidden = true; return; }
  block.hidden = false;
  vGeladen = true;

  const esc = t => String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  document.getElementById('vereine').innerHTML = zeilen.map(c => {
    const offen = vOffen === c.klub;
    const torlastig = (c.siege || 0) > (c.punkte || 0);
    return `
      <div class="kr-verein ${offen ? 'offen' : ''}" data-klub="${esc(c.klub)}">
        <button type="button" class="kr-kopf">
          ${UI.wappenBild(c.klub, 34)}
          <span class="kr-name">${esc(c.klub)}
            <em>${esc(c.liga || '')} · ${c.von_jahr}–${c.bis_jahr}</em></span>
          <span class="kr-zahlen"><b>${c.saisons}</b><i>Saisons</i></span>
          <span class="kr-zahlen"><b>${torlastig ? c.siege : c.punkte}</b><i>${
            torlastig ? 'Siege' : 'Punkte'}</i></span>
          <span class="kr-zahlen ${c.titel ? 'gold' : ''}"><b>${c.titel}</b><i>Titel</i></span>
          <span class="kr-zahlen"><b>${c.spieler}</b><i>Spieler</i></span>
        </button>
        ${offen ? '<div class="kr-spieler" data-fuer="' + esc(c.klub)
          + '"><p class="small" style="margin:8px 0">Wird geladen …</p></div>' : ''}
      </div>`;
  }).join('');

  document.getElementById('vereine').querySelectorAll('.kr-kopf').forEach(b =>
    b.onclick = async () => {
      const k = b.closest('[data-klub]').dataset.klub;
      vOffen = vOffen === k ? null : k;
      await vereineZeichnen();
      if (vOffen) await spielerLaden(vOffen);
    });
}

async function spielerLaden(klub){
  const ziel = document.querySelector('.kr-spieler[data-fuer]');
  if (!ziel) return;
  const { zeilen, fehler } = await KONTO.vereinsSpieler(klub);
  const esc = t => String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  if (fehler || !zeilen.length){
    ziel.innerHTML = '<p class="small" style="margin:8px 0">Keine Einträge.</p>';
    return;
  }
  ziel.innerHTML = zeilen.map(sp => `
    <div class="kr-zeile ${sp.platz === 1 ? 'bester' : ''}">
      <span class="kr-platz">${sp.platz}</span>
      <span class="kr-sp-name">${esc(sp.spieler)}
        <em>${esc(sp.position)} · ${esc(sp.profil || '')} · ${sp.von_jahr}–${sp.bis_jahr}</em></span>
      <span class="kr-sp-wert">${sp.saisons}<i>Sais.</i></span>
      <span class="kr-sp-wert">${sp.ist_torhueter ? sp.siege : sp.punkte}<i>${
        sp.ist_torhueter ? 'Siege' : 'Pkt'}</i></span>
      <span class="kr-sp-wert">${sp.beste_wertung}<i>OVR</i></span>
      ${sp.titel ? `<span class="kr-sp-titel">${sp.titel}×🏆</span>` : ''}
    </div>`).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  const s = document.getElementById('v-sort');
  if (s) s.onchange = () => { vOffen = null; vereineZeichnen(); };
  vereineZeichnen();
});
</script>
</body>
</html>
