<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Errate den Stil – Eishockey-Ratespiel | Puckero</title>
<meta name="description" content="Drei Attributwerte, vier mögliche Stilkarten: Erkennst du den Eishockey-Spielertyp allein an seinem Profil?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>
/* Gespeichertes Thema sofort anwenden, damit nichts aufblitzt */
try{var t=localStorage.getItem('puckero.thema');
    if(t==='verspielt')document.documentElement.setAttribute('data-thema','verspielt');}catch(e){}
</script>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%230b1220' stroke='%2338d1ff' stroke-width='3'/></svg>">
</head>
<body data-nav="Spiele">
<div id="hdr"></div>

<section class="block tight">
  <div class="wrap narrow">
    <span class="eyebrow">Fünf Runden</span>
    <h1 style="font-size:clamp(34px,5vw,58px)">Errate den Stil</h1>
    <p class="lead">Du siehst das Attributprofil einer Stilkarte und ihre Beschreibung –
      aber nicht den Namen. Vier Karten stehen zur Wahl, nur eine passt.</p>

    <div class="panel mt-l" id="spiel"></div>
  </div>
</section>

<div id="ftr"></div>

<script src="assets/data.js"></script>
<script src="assets/draft.js"></script>
<script src="assets/engine.js"></script>
<script src="assets/wappen.js"></script>
<script src="assets/ui.js"></script>
<script>
const root = document.getElementById('spiel');
const ALLE = PUCKERO_DATA.LEGENDS;
const ATTRNAME = k => PUCKERO_DATA.ATTRS.skater.concat(PUCKERO_DATA.ATTRS.goalie).find(a => a.k === k)?.n || k;

let runde = 0, punkte = 0, fragen = [], beantwortet = false;
const RUNDEN = 5;

function neu(){
  runde = 0; punkte = 0; beantwortet = false;
  const r = PUCKERO.rng(String(Date.now()) + Math.random());
  const pool = PUCKERO.shuffle(r, ALLE);
  fragen = pool.slice(0, RUNDEN).map(ziel => {
    const falsche = PUCKERO.shuffle(r, ALLE.filter(x => x.id !== ziel.id)).slice(0, 3);
    return { ziel, optionen: PUCKERO.shuffle(r, [ziel, ...falsche]) };
  });
  zeige();
}

function zeige(){
  if (runde >= RUNDEN) return ende();
  const f = fragen[runde];
  const b = Object.entries(f.ziel.b).sort((a, c) => c[1] - a[1]);
  root.innerHTML = `
    <div class="panel-head">
      <h3>Runde ${runde + 1} von ${RUNDEN}</h3>
      <span class="pill">${punkte} Treffer</span>
    </div>
    <div class="panel-body">
      <div class="card">
        <span class="lc-tag">Position ${f.ziel.pos.join('/')}</span>
        <p style="color:var(--muted);font-style:italic;margin:10px 0 16px">„${f.ziel.desc}“</p>
        <div class="attrs" style="grid-template-columns:1fr">
          ${b.map(([k, v]) => `<div class="attr">
              <span class="n">${ATTRNAME(k)}</span>
              <span class="bar"><i class="${v < 0 ? 'lo' : 'hi'}" style="width:${Math.min(100, Math.abs(v) * 6)}%"></i></span>
              <span class="v" style="color:${v < 0 ? 'var(--red)' : 'var(--green)'}">${v > 0 ? '+' : ''}${v}</span>
            </div>`).join('')}
        </div>
      </div>
      <div class="grid g2 mt-l" id="optionen">
        ${f.optionen.map(o => `<button class="choice" data-id="${o.id}"
            style="padding:14px 18px;text-align:left;border-radius:12px">${o.n}
            <span class="small" style="display:block;color:var(--dim)">${o.tag}</span></button>`).join('')}
      </div>
      <div id="feedback" class="mt-l"></div>
    </div>`;

  beantwortet = false;
  root.querySelectorAll('#optionen .choice').forEach(btn => btn.onclick = () => antwort(btn, f));
}

function antwort(btn, f){
  if (beantwortet) return;
  beantwortet = true;
  const richtig = btn.dataset.id === f.ziel.id;
  if (richtig) punkte++;
  root.querySelectorAll('#optionen .choice').forEach(b => {
    if (b.dataset.id === f.ziel.id){ b.style.borderColor = 'var(--green)'; b.style.color = 'var(--green)'; }
    else if (b === btn){ b.style.borderColor = 'var(--red)'; b.style.color = 'var(--red)'; }
  });
  document.getElementById('feedback').innerHTML = `
    <p style="color:${richtig ? 'var(--green)' : 'var(--red)'};font-weight:700;margin-bottom:6px">
      ${richtig ? 'Richtig.' : 'Daneben.'} Gesucht war: ${f.ziel.n}</p>
    <p class="small">${f.ziel.tag} · Ära ${f.ziel.era}</p>
    <button class="btn btn-primary mt" id="weiter">${runde + 1 >= RUNDEN ? 'Auswertung' : 'Nächste Runde'}</button>`;
  document.getElementById('weiter').onclick = () => { runde++; zeige(); };
}

function ende(){
  const text = punkte === 5 ? 'Du kennst jede Karte im Stapel.'
             : punkte >= 4 ? 'Starke Quote – da fehlt nicht viel.'
             : punkte >= 2 ? 'Solide. Ein paar Profile sehen sich eben ähnlich.'
             : 'Da hilft nur eine Runde Eislegende zum Ueben.';
  root.innerHTML = `
    <div class="panel-head"><h3>Auswertung</h3></div>
    <div class="panel-body center">
      <div class="ovr ${punkte >= 4 ? 'gold' : ''}" style="margin:0 auto 18px">
        <b>${punkte}</b><span>von ${RUNDEN}</span></div>
      <p class="lead">${text}</p>
      <div class="row mt-l" style="justify-content:center">
        <button class="btn btn-primary" id="nochmal">Nochmal spielen</button>
        <a class="btn btn-ghost" href="index.html#spielen">Karriere starten</a>
      </div>
    </div>`;
  document.getElementById('nochmal').onclick = neu;
}

neu();
</script>
</body>
</html>
