<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokalraum – deine gespeicherten Karrieren | Eiszeit</title>
<meta name="description" content="Alle abgeschlossenen Eishockey-Karrieren auf einen Blick: sortiert nach Legendenpunkten, mit Seed zum Nachspielen. Gespeichert wird ausschließlich lokal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>
/* Gespeichertes Thema sofort anwenden, damit nichts aufblitzt */
try{var t=localStorage.getItem('eiszeit.thema')||localStorage.getItem('puckero.thema');
    if(t==='verspielt'||t==='retro')document.documentElement.setAttribute('data-thema',t);}catch(e){}
</script>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%230b1220' stroke='%2338d1ff' stroke-width='3'/></svg>">
</head>
<body data-nav="Pokalraum">
<div id="hdr"></div>

<section class="block tight">
  <div class="wrap">
    <span class="eyebrow">Nur auf diesem Gerät</span>
    <h1 style="font-size:clamp(34px,5vw,58px)">Pokalraum</h1>
    <p class="lead">Jede abgeschlossene Karriere landet hier – ohne Konto, ohne Server.
      Die Daten liegen im Speicher deines Browsers und verschwinden, wenn du ihn leerst.</p>

    <div id="uebersicht" class="grid g4 mt-l"></div>

    <div class="row between mt-l" id="bestenliste">
      <h2 class="mb0">Bestenliste</h2>
      <div class="row">
        <select id="sortierung" style="width:auto">
          <option value="legacy">Nach Legendenpunkten</option>
          <option value="peak">Nach Bestwert</option>
          <option value="titles">Nach Trophäen</option>
          <option value="t">Nach Datum</option>
        </select>
        <button class="btn btn-ghost btn-sm" id="leeren">Alles löschen</button>
      </div>
    </div>

    <div id="liste" class="mt"></div>
  </div>
</section>

<div id="ftr"></div>

<script src="assets/data.js"></script>
<script src="assets/draft.js"></script>
<script src="assets/engine.js"></script>
<script src="assets/wappen.js"></script>
<script src="assets/ui.js"></script>
<script>
function zeichne(){
  const alle = PUCKERO.loadCareers();
  const sortKey = document.getElementById('sortierung').value;

  /* Übersicht */
  const ue = document.getElementById('uebersicht');
  if (!alle.length){
    ue.innerHTML = '';
    document.getElementById('liste').innerHTML = `
      <div class="card center pad-lg">
        <h3>Noch nichts in der Vitrine</h3>
        <p style="color:var(--muted)">Spiel eine Karriere zu Ende, dann steht sie hier.</p>
        <a class="btn btn-primary mt" href="index.html#spielen">Karriere starten</a>
      </div>`;
    return;
  }
  const besteLegacy = Math.max(...alle.map(k => k.legacy));
  const titelSumme = alle.reduce((s, k) => s + k.titles, 0);
  const saisons = alle.reduce((s, k) => s + k.seasons, 0);
  const kacheln = [
    ['Karrieren', alle.length],
    ['Beste Wertung', besteLegacy],
    ['Trophäen insgesamt', titelSumme],
    ['Gespielte Saisons', saisons]
  ];
  ue.innerHTML = kacheln.map(([n, v]) => `
    <div class="card center">
      <div style="font-family:var(--display);font-size:44px;line-height:1;color:var(--accent)">${v}</div>
      <div class="small" style="letter-spacing:.1em;text-transform:uppercase">${n}</div>
    </div>`).join('');

  /* Liste */
  const sortiert = alle.slice().sort((a, b) => (b[sortKey] || 0) - (a[sortKey] || 0));
  document.getElementById('liste').innerHTML = sortiert.map((k, i) => {
    const nat = PUCKERO.nation(k.nation) || { flag:'', n:'' };
    const P = PUCKERO.pos(k.pos) || { n: k.pos };
    const gold = k.legacy >= 1300;
    const datum = new Date(k.t).toLocaleDateString('de-DE');
    return `<div class="season">
      <div class="season-head">
        <span class="yr">#${i + 1}</span>
        <span class="club">${k.name} <span style="color:var(--dim)">#${k.num}</span></span>
        <span class="lg">${nat.flag} ${P.n}</span>
        <span class="pill ${gold ? 'gold' : ''}">${k.rank}</span>
        <span class="pill">${k.legacy} Punkte</span>
      </div>
      <div class="statline">
        <span>Bestwert <b>${k.peak}</b></span>
        <span>Saisons <b>${k.seasons}</b></span>
        <span>Trophäen <b>${k.titles}</b></span>
        <span>${k.isG ? 'Siege' : 'Punkte'} <b>${k.p}</b></span>
        <span>Gespielt am <b>${datum}</b></span>
      </div>
      <div class="row mt" style="gap:8px">
        <a class="btn btn-ghost btn-sm" href="index.html?seed=${encodeURIComponent(k.seed)}#spielen">Nachspielen</a>
        <button class="btn btn-ghost btn-sm" data-seed="${encodeURIComponent(k.seed)}">Seed kopieren</button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('liste').querySelectorAll('[data-seed]').forEach(b => {
    b.onclick = () => UI.copy(decodeURIComponent(b.dataset.seed), 'Seed kopiert');
  });
}

document.getElementById('sortierung').onchange = zeichne;
document.getElementById('leeren').onclick = () => {
  if (confirm('Alle gespeicherten Karrieren unwiderruflich löschen?')){
    PUCKERO.clearCareers();
    zeichne();
    UI.toast('Pokalraum geleert');
  }
};
zeichne();
</script>
</body>
</html>
