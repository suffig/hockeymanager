<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">

<meta name="description" content="Eine komplette Eishockey-Karriere ohne Draft und ohne Entscheidungen: Spieler würfeln lassen, Laufbahn ansehen, wiederholen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Als App auf dem Startbildschirm -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="assets/app/apple-touch-icon.png">
<script>
/* Gespeichertes Thema sofort anwenden, damit nichts aufblitzt */
try{var t=localStorage.getItem('eiszeit.thema')||localStorage.getItem('puckero.thema');
    if(t==='verspielt'||t==='retro')document.documentElement.setAttribute('data-thema',t);}catch(e){}
</script>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%230b1220' stroke='%2338d1ff' stroke-width='3'/></svg>">
</head>
<body data-nav="Spiele">
<div id="hdr"></div>

<section class="block tight">
  <div class="wrap">
    <span class="eyebrow">Zwei Minuten</span>
    <h1 style="font-size:clamp(34px,5vw,58px)">Schnellkarriere</h1>
    <p class="lead">Keine Fragen, kein Draft. Eiszeit würfelt Identität und Charakter aus
      und spielt die komplette Laufbahn durch. Ideal, um die Simulation kennenzulernen –
      oder um zu sehen, wie oft aus einem Zufallsspieler eine Legende wird.</p>

    <div class="row mt-l">
      <button class="btn btn-primary" id="roll">Karriere würfeln</button>
      <button class="btn btn-ghost" id="roll10">Zehn Karrieren vergleichen</button>
    </div>

    <div class="panel mt-l" id="game"></div>
    <div id="batch" class="mt-l"></div>
  </div>
</section>

<div id="ftr"></div>

<script src="assets/data.js?v=64fbb2d4"></script>
<script src="assets/draft.js?v=64fbb2d4"></script>
<script src="assets/engine.js?v=64fbb2d4"></script>
<script src="assets/ereignisse.js?v=64fbb2d4"></script>
<script src="assets/wappen.js?v=64fbb2d4"></script>
<script src="assets/ui.js?v=64fbb2d4"></script>
<script src="assets/game.js?v=64fbb2d4"></script>
<script>
const root = document.getElementById('game');
let game;

function roll(){
  document.getElementById('batch').innerHTML = '';
  const seed = 'schnell-' + Date.now() + '-' + Math.random();
  const r = PUCKERO.rng(seed);
  const ident = PUCKERO.randomIdentity(r);
  ident.mode = 'klassisch';
  if (!game) game = CareerGame(root, { skipInitial: true, onAgain: roll });
  game.quickRun(seed, ident);
}

function rollBatch(){
  const rows = [];
  for (let i = 0; i < 10; i++){
    const seed = 'batch-' + Date.now() + '-' + i + '-' + Math.random();
    const r = PUCKERO.rng(seed);
    const ident = PUCKERO.randomIdentity(r);
    const p = PUCKERO.autoDraft(PUCKERO.newPlayer({ ...ident, mode:'klassisch', seed }));
    rows.push(PUCKERO.simulate(p));
  }
  rows.sort((a, b) => b.legacy - a.legacy);
  document.getElementById('batch').innerHTML = `
    <h2>Zehn Zufallskarrieren</h2>
    <p class="lead">Sortiert nach Legendenpunkten. So sieht die Verteilung aus, wenn niemand draftet.</p>
    <div class="table-scroll card" style="padding:8px 16px">
      <table class="stats">
        <thead><tr><th>Spieler</th><th>Pos</th><th>Saisons</th><th>Bestwert</th><th>Titel</th><th>Punkte/Siege</th><th>Legende</th><th>Rang</th></tr></thead>
        <tbody>${rows.map(res => `<tr>
          <td>${res.player.name}</td>
          <td>${res.player.pos}</td>
          <td>${res.seasons.length}</td>
          <td>${res.peak}</td>
          <td>${res.trophies.reduce((s,x)=>s+x.x,0)}</td>
          <td>${res.isG ? res.totals.wins : res.totals.p}</td>
          <td><b>${res.legacy}</b></td>
          <td>${res.rank.n}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  document.getElementById('batch').scrollIntoView({ behavior:'smooth', block:'start' });
}

document.getElementById('roll').onclick = roll;
document.getElementById('roll10').onclick = rollBatch;
roll();
</script>
</body>
</html>
