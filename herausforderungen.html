<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Herausforderungen – Ziele für deine Karrieren | Eiszeit</title>
<meta name="description" content="Zweiundzwanzig Ziele für deine Eishockey-Karrieren: Stanley Cup, Doppelgold, 1000 Punkte, Einvereinsmann und mehr. Jede abgeschlossene Karriere zählt automatisch.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=636f95e2">

<!-- Als App auf dem Startbildschirm -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eiszeit">
<link rel="apple-touch-icon" href="assets/app/apple-touch-icon.png">
<script>
/* Gespeichertes Thema sofort anwenden, damit nichts aufblitzt */
try{var t=localStorage.getItem('eiszeit.thema')||localStorage.getItem('puckero.thema');
    /* Liste hier und THEMEN in ui.js muessen dieselben Namen kennen. */
    if(t==='verspielt'||t==='retro'||t==='flutlicht')document.documentElement.setAttribute('data-thema',t);}catch(e){}
</script>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%230b1220' stroke='%2338d1ff' stroke-width='3'/></svg>">
</head>
<body data-nav="Herausforderungen">
<div id="hdr"></div>

<section class="block tight">
  <div class="wrap">
    <span class="eyebrow">Langzeitziele</span>
    <h1 style="font-size:clamp(34px,5vw,58px)">Herausforderungen</h1>
    <p class="lead"><span id="zielzahl">Ziele</span>, die sich nicht in einer einzigen Laufbahn erreichen lassen.
      Jede abgeschlossene Karriere wird automatisch geprüft – egal ob Eislegende,
      Schnellkarriere oder Tageskarriere.</p>

    <div class="card mt-l" id="fortschritt"></div>

    <div class="grid g3 mt-l" id="liste"></div>

    <div class="row mt-l">
      <a class="btn btn-primary" href="index.html#spielen">Karriere starten</a>
      <button class="btn btn-ghost btn-sm" id="zuruecksetzen">Fortschritt zurücksetzen</button>
    </div>
  </div>
</section>

<div id="ftr"></div>

<script src="assets/data.js?v=636f95e2"></script>
<script src="assets/draft.js?v=636f95e2"></script>
<script src="assets/engine.js?v=636f95e2"></script>
<script src="assets/wappen.js?v=636f95e2"></script>
<script src="assets/ui.js?v=636f95e2"></script>
<script>
function zeichne(){
  const stand = PUCKERO.ladeHerausforderungen();
  const alle = PUCKERO_DATA.HERAUSFORDERUNGEN;
  // Die Zahl kommt aus den Daten - so kann sie nicht veralten.
  document.getElementById('zielzahl').textContent = alle.length + ' Ziele';
  const geschafft = alle.filter(h => stand[h.id]).length;
  const anteil = Math.round(geschafft / alle.length * 100);

  document.getElementById('fortschritt').innerHTML = `
    <div class="row between" style="margin-bottom:10px">
      <span><b style="font-family:var(--display);font-size:30px;color:var(--accent)">${geschafft}</b>
        <span class="small">von ${alle.length} geschafft</span></span>
      <span class="small">${anteil}%</span>
    </div>
    <span class="bar" style="height:10px"><i class="${geschafft === alle.length ? 'hi' : ''}"
      style="width:${anteil}%"></i></span>`;

  document.getElementById('liste').innerHTML = alle.map(h => {
    const s = stand[h.id];
    const datum = s ? new Date(s.t).toLocaleDateString('de-DE') : null;
    return `<div class="card" style="${s ? 'border-color:rgba(255,200,97,.35)' : 'opacity:.72'}">
      <div class="row" style="gap:12px;align-items:flex-start">
        <div style="font-size:28px;line-height:1;${s ? '' : 'filter:grayscale(1);opacity:.5'}">${h.icon}</div>
        <div style="flex:1;min-width:0">
          <h3 style="margin-bottom:4px;${s ? 'color:var(--gold)' : ''}">${h.n}</h3>
          <p class="small mb0">${h.d}</p>
          ${s ? `<p class="small mt mb0" style="color:var(--gold)">
                   Geschafft am ${datum} mit ${s.name}</p>`
              : '<p class="small mt mb0" style="color:var(--dim)">Noch offen</p>'}
        </div>
      </div>
    </div>`;
  }).join('');
}

document.getElementById('zuruecksetzen').onclick = () => {
  if (confirm('Alle erreichten Herausforderungen zurücksetzen?')){
    PUCKERO.clearHerausforderungen();
    zeichne();
    UI.toast('Fortschritt zurückgesetzt');
  }
};
zeichne();
</script>
</body>
</html>
