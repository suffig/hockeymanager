<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beste Aufstellung – Eishockey-Kaderpuzzle | Puckero</title>
<meta name="description" content="Fünf Positionen, ein festes Gehaltsbudget: Stell die stärkste Eishockey-Formation zusammen, die du dir leisten kannst.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%230b1220' stroke='%2338d1ff' stroke-width='3'/></svg>">
</head>
<body data-nav="Spiele">
<div id="hdr"></div>

<section class="block tight">
  <div class="wrap">
    <span class="eyebrow">Strategie</span>
    <h1 style="font-size:clamp(34px,5vw,58px)">Beste Aufstellung</h1>
    <p class="lead">Ein Torhüter, zwei Verteidiger, zwei Stürmer. Zwölf Gehaltsmillionen für fünf Verträge.
      Der Markt wechselt bei jeder neuen Runde – die Rechnung bleibt dieselbe.</p>

    <div class="row between mt-l">
      <div class="row">
        <span class="pill" id="budget">Budget: 12.0 Mio</span>
        <span class="pill" id="staerke">Teamstärke: 0</span>
      </div>
      <div class="row">
        <button class="btn btn-ghost btn-sm" id="neu">Neuer Markt</button>
        <button class="btn btn-primary btn-sm" id="werten" disabled>Aufstellung werten</button>
      </div>
    </div>

    <div class="grid g2 mt-l" style="align-items:start">
      <div>
        <h2>Markt</h2>
        <div id="markt" class="grid" style="gap:10px"></div>
      </div>
      <div>
        <h2>Deine Formation</h2>
        <div id="kader" class="card"></div>
        <div id="ergebnis" class="mt"></div>
      </div>
    </div>
  </div>
</section>

<div id="ftr"></div>

<script src="assets/data.js"></script>
<script src="assets/draft.js"></script>
<script src="assets/engine.js"></script>
<script src="assets/wappen.js"></script>
<script src="assets/ui.js"></script>
<script>
const SLOTS = [
  { k:'G',  n:'Torhüter' },
  { k:'D',  n:'Verteidiger 1' },
  { k:'D',  n:'Verteidiger 2' },
  { k:'F',  n:'Stürmer 1' },
  { k:'F',  n:'Stürmer 2' }
];
const BUDGET = 12.0;
let markt = [], kader = [], gewertet = false;

/* Marktspieler werden wie echte Profis erzeugt: voller Draft, dann Alterskurve.
   Erst dadurch entstehen realistische Wertungen zwischen etwa 55 und 95. */
function baueMarkt(){
  const r = PUCKERO.rng(String(Date.now()) + Math.random());
  markt = [];
  const verteilung = ['G','G','G','D','D','D','D','D','C','C','C','LW','LW','RW','RW','LW','RW','C'];
  verteilung.forEach((posK, idx) => {
    const ident = { name: PUCKERO.pick(r, PUCKERO_DATA.FIRST) + ' ' + PUCKERO.pick(r, PUCKERO_DATA.LAST),
                    num: PUCKERO.ri(r, 1, 97), nation: PUCKERO.pick(r, PUCKERO_DATA.NATIONS).k,
                    pos: posK, mode:'klassisch' };
    // Solange wuerfeln, bis ein Spieler auf Profiniveau herauskommt
    let p, alter, ovr, versuch = 0;
    do {
      p = PUCKERO.newPlayer({ ...ident, seed: 'markt-' + idx + '-' + versuch + '-' + r() });
      // Unterschiedlich gut gedraftete Spieler: manche verschenken ihr Potenzial
      const guete = 0.35 + r() * 0.65;
      for (let i = 0; i < PUCKERO.DRAFT_ROUNDS; i++){
        const opts = PUCKERO.draftOptions(p, i, 0);
        if (!opts.length) break;
        const bewertet = opts.map(o => ({ o, s: PUCKERO.pickValue(p, o) * guete + r() * 20 }));
        bewertet.sort((a, b) => b.s - a.s);
        PUCKERO.applyPick(p, bewertet[0].o);
      }
      alter = PUCKERO.ri(r, 20, 34);
      ovr = PUCKERO.overall(p, PUCKERO.devAttrs(p.attrs, PUCKERO.formFactor(alter, p.traits)));
    } while (ovr < 60 && ++versuch < 8);

    // Preis waechst ueberproportional mit der Wertung, damit das Budget wirklich bindet
    const basis = Math.pow(Math.max(0, ovr - 55) / 40, 2.2) * 9 + 0.25;
    const altersfaktor = alter > 32 ? 0.74 : (alter < 22 ? 0.88 : 1);
    const preis = Math.max(0.2, Math.round(basis * altersfaktor * 10) / 10);

    markt.push({ id:'m' + idx, name: ident.name, num: ident.num, nation: ident.nation,
                 pos: posK, ovr, alter, preis, picks: p.picks.map(x => x.tag) });
  });

  /* Preise normieren: Die billigste zulässige Aufstellung soll rund ein Drittel
     des Budgets kosten. Dadurch ist immer eine Formation bezahlbar – und das
     Budget bleibt trotzdem die entscheidende Grenze. */
  const billigste = (filter, n) => markt.filter(filter)
    .sort((a, b) => a.preis - b.preis).slice(0, n)
    .reduce((s, x) => s + x.preis, 0);
  const minKader = billigste(x => x.pos === 'G', 1)
                 + billigste(x => x.pos === 'D', 2)
                 + billigste(x => ['C','LW','RW'].includes(x.pos), 2);
  if (minKader > 0){
    const faktor = (BUDGET * 0.32) / minKader;
    markt.forEach(x => x.preis = Math.max(0.2, Math.round(x.preis * faktor * 10) / 10));
  }

  markt.sort((a, b) => b.ovr - a.ovr);
  kader = []; gewertet = false;
  document.getElementById('ergebnis').innerHTML = '';
  zeichne();
}

function passt(spieler, slot){
  if (slot.k === 'G') return spieler.pos === 'G';
  if (slot.k === 'D') return spieler.pos === 'D';
  return ['C','LW','RW'].includes(spieler.pos);
}

function ausgaben(){ return kader.reduce((s, x) => s + x.preis, 0); }

function zeichne(){
  const rest = BUDGET - ausgaben();
  document.getElementById('budget').textContent = 'Rest: ' + rest.toFixed(1) + ' Mio von ' + BUDGET.toFixed(1);
  document.getElementById('staerke').textContent = 'Teamstärke: ' + teamStaerke();
  document.getElementById('werten').disabled = kader.length < SLOTS.length;

  document.getElementById('markt').innerHTML = markt.map(s => {
    const drin = kader.some(k => k.id === s.id);
    const slotFrei = SLOTS.some((sl, i) => passt(s, sl) && !kader.some(k => k._slot === i));
    const zuTeuer = !drin && s.preis > rest;
    const nat = PUCKERO.nation(s.nation);
    const stil = 'padding:12px 16px;'
      + (drin ? 'border-color:var(--green);' : '')
      + (!drin && (zuTeuer || !slotFrei) ? 'opacity:.42;' : '');
    return `<button class="legend-card" data-id="${s.id}" data-frei="${!drin && !zuTeuer && slotFrei ? 1 : 0}"
      style="${stil}">
      <div class="row between" style="gap:10px">
        <div>
          <div style="font-weight:700">${s.name} <span class="small">#${s.num}</span></div>
          <div class="small">${nat.flag} ${s.pos} · ${s.alter} Jahre · ${s.picks.slice(0,2).join(', ')}</div>
        </div>
        <div style="text-align:right;flex:none">
          <div style="font-family:var(--display);font-size:26px;line-height:1;color:${s.ovr >= 82 ? 'var(--gold)' : 'var(--accent)'}">${s.ovr}</div>
          <div class="small">${s.preis.toFixed(1)} Mio</div>
        </div>
      </div>
    </button>`;
  }).join('');

  document.getElementById('markt').querySelectorAll('.legend-card').forEach(b => {
    b.onclick = () => toggle(b.dataset.id);
  });

  document.getElementById('kader').innerHTML = SLOTS.map((sl, i) => {
    const s = kader.find(k => k._slot === i);
    return `<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--line-soft)">
      <div>
        <div class="small" style="letter-spacing:.1em;text-transform:uppercase">${sl.n}</div>
        <div style="font-weight:700">${s ? s.name + ' (' + s.pos + ')' : '<span style="color:var(--dim)">frei</span>'}</div>
      </div>
      <div style="text-align:right">
        ${s ? `<div style="font-family:var(--display);font-size:24px;color:var(--accent)">${s.ovr}</div>
               <div class="small">${s.preis.toFixed(1)} Mio</div>` : '<span class="small">–</span>'}
      </div>
    </div>`;
  }).join('') + `<div class="row between mt"><b>Ausgaben</b><b>${ausgaben().toFixed(1)} Mio</b></div>`;
}

function toggle(id){
  const s = markt.find(x => x.id === id);
  const drin = kader.findIndex(k => k.id === id);
  if (drin >= 0){ kader.splice(drin, 1); zeichne(); return; }
  const slot = SLOTS.findIndex((sl, i) => passt(s, sl) && !kader.find(k => k._slot === i));
  if (slot < 0) return UI.toast('Kein freier Platz für diese Position');
  if (s.preis > BUDGET - ausgaben()) return UI.toast('Budget reicht nicht');
  kader.push({ ...s, _slot: slot });
  zeichne();
}

function teamStaerke(){
  if (!kader.length) return 0;
  const g = kader.find(k => k.pos === 'G');
  const d = kader.filter(k => k.pos === 'D');
  const f = kader.filter(k => ['C','LW','RW'].includes(k.pos));
  const mittel = arr => arr.length ? arr.reduce((s, x) => s + x.ovr, 0) / arr.length : 0;
  return Math.round((g ? g.ovr : 0) * 0.32 + mittel(d) * 0.32 + mittel(f) * 0.36);
}

function werten(){
  gewertet = true;
  const st = teamStaerke();
  const rest = BUDGET - ausgaben();
  const effizienz = Math.round(st / Math.max(1, ausgaben()) * 10) / 10;
  let urteil, farbe;
  if (st >= 82){ urteil = 'Titelkandidat. Diese Formation gewinnt Serien.'; farbe = 'gold'; }
  else if (st >= 76){ urteil = 'Playoff-Team mit klarer Spitze.'; farbe = 'green'; }
  else if (st >= 70){ urteil = 'Mittelfeld. Genug für die Qualifikation, zu wenig für mehr.'; farbe = ''; }
  else { urteil = 'Abstiegskampf. Da fehlt an mehreren Stellen die Qualität.'; farbe = ''; }

  document.getElementById('ergebnis').innerHTML = `
    <div class="card">
      <div class="row" style="gap:18px">
        <div class="ovr ${farbe === 'gold' ? 'gold' : ''}"><b>${st}</b><span>Team</span></div>
        <div style="flex:1;min-width:180px">
          <h3 style="margin-bottom:4px">${urteil}</h3>
          <p class="small mb0">Ausgaben ${ausgaben().toFixed(1)} Mio · ${rest.toFixed(1)} Mio übrig ·
            Effizienz ${effizienz} Punkte je Million</p>
        </div>
      </div>
      <p class="small mt">Tipp: Der Torhüter zählt fast so viel wie beide Verteidiger zusammen.
        Wer dort spart, spart an der falschen Stelle.</p>
    </div>`;
}

document.getElementById('neu').onclick = baueMarkt;
document.getElementById('werten').onclick = werten;
baueMarkt();
</script>
</body>
</html>
